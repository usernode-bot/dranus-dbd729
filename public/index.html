  <style>
    :root {
      --bg: #f6efe3; --bg2: #efe4d1; --panel: #fffaf2; --panel2: #f1e6d3;
      --text: #2a1d17; --muted: #74645a; --line: rgba(60, 30, 20, .14);
      --gold: #9c7424; --gold-soft: rgba(156, 116, 36, .14); --maroon: #7a1f2b; --maroon-hi: #93283a;
      --danger: #b3261e; --ok: #2e7d4f; --warn: #b26a00;
      --shadow: 0 6px 24px rgba(60, 30, 10, .12);
      --un-accent: #7a1f2b; --un-accent-contrast: #fff;
      --un-sheet-bg: #fffaf2; --un-popover-bg: #fffaf2; --un-group-bg: #fffaf2;
      --nav-h: 64px;
      --safe-b: var(--un-safe-inset-bottom, env(safe-area-inset-bottom, 0px));
      --safe-t: var(--un-safe-inset-top, env(safe-area-inset-top, 0px));
      --font-title: "Cinzel", "Trajan Pro", "Cormorant SC", "Playfair Display", Georgia, "Times New Roman", serif;
      --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
    }
    .dark {
      --bg: #0c0a0d; --bg2: #120f14; --panel: #17131a; --panel2: #211b24;
      --text: #f2eadc; --muted: #a59a8c; --line: rgba(255, 240, 210, .1);
      --gold: #d4a64a; --gold-soft: rgba(212, 166, 74, .14); --maroon: #8a2433; --maroon-hi: #a32d3f;
      --danger: #ef6b5e; --ok: #5fc48a; --warn: #e5a23c;
      --shadow: 0 8px 30px rgba(0, 0, 0, .45);
      --un-accent: #d4a64a; --un-accent-contrast: #1a1206;
      --un-sheet-bg: #1b161e; --un-popover-bg: #1b161e; --un-group-bg: #1b161e;
    }
    html, body { background: var(--bg); color: var(--text); font-family: var(--font-body); }
    body { min-height: 100vh; margin: 0; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    button, input, select, textarea { font: inherit; color: inherit; }
    .title-font { font-family: var(--font-title); letter-spacing: .12em; text-transform: uppercase; }
    .muted { color: var(--muted); }
    .gold { color: var(--gold); }
    .small { font-size: .82rem; }
    .tiny { font-size: .72rem; }
    .hidden { display: none !important; }
    .row { display: flex; gap: .5rem; align-items: center; }
    .row.wrap { flex-wrap: wrap; }
    .grow { flex: 1 1 auto; min-width: 0; }
    .stack { display: flex; flex-direction: column; gap: .75rem; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
    @media (max-width: 420px) { .grid2.resp { grid-template-columns: 1fr; } }

    /* Header */
    .hdr { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
      padding: calc(.5rem + var(--safe-t)) .75rem .5rem; }
    .hdr-in { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: .5rem; }
    .brand { display: flex; align-items: center; gap: .5rem; min-width: 0; }
    .brand h1 { font-size: 1rem; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--gold); }
    .proj-name { background: transparent; border: 1px solid transparent; border-radius: 10px; padding: .4rem .5rem;
      font-weight: 600; font-size: 1rem; min-width: 0; width: 100%; }
    .proj-name:focus { border-color: var(--gold); outline: none; background: var(--panel); }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; min-height: 44px;
      padding: .55rem 1rem; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2);
      font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.primary { background: var(--maroon); border-color: var(--maroon); color: #fff6e6; }
    .btn.primary:hover:not(:disabled) { background: var(--maroon-hi); }
    .btn.gold { background: var(--gold); border-color: var(--gold); color: #1a1206; }
    .btn.ghost { background: transparent; }
    .btn.danger { color: var(--danger); }
    .btn.big { min-height: 54px; font-size: 1.05rem; padding: .7rem 1.3rem; border-radius: 14px; }
    .btn.sm { min-height: 36px; padding: .3rem .7rem; font-size: .85rem; border-radius: 10px; }
    .icon-btn { width: 44px; height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: center;
      border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); cursor: pointer; padding: 0; }
    .icon-btn.sm { width: 36px; height: 36px; min-width: 36px; border-radius: 10px; }
    .icon-btn svg, .btn svg { width: 20px; height: 20px; }
    .chip { display: inline-flex; align-items: center; gap: .3rem; padding: .2rem .6rem; border-radius: 999px;
      font-size: .75rem; font-weight: 600; background: var(--gold-soft); color: var(--gold); }
    .chip.red { background: rgba(179, 38, 30, .14); color: var(--danger); }
    .chip.green { background: rgba(46, 125, 79, .16); color: var(--ok); }

    /* Layout */
    .main { max-width: 1100px; margin: 0 auto; padding: 1rem .9rem calc(var(--nav-h) + 6.5rem + var(--safe-b)); }
    .main.home { padding-bottom: calc(2rem + var(--safe-b)); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 1rem; box-shadow: var(--shadow); }
    .card.flat { box-shadow: none; }
    .sec-title { font-family: var(--font-title); letter-spacing: .1em; text-transform: uppercase; font-size: .95rem; color: var(--gold); margin: 0 0 .6rem; }
    .step-head h2 { font-family: var(--font-title); letter-spacing: .1em; text-transform: uppercase; margin: 0; font-size: 1.35rem; }
    .step-head p { margin: .25rem 0 0; }

    /* Forms */
    label.fld { display: flex; flex-direction: column; gap: .3rem; font-size: .82rem; font-weight: 600; color: var(--muted); }
    .inp, select.inp, textarea.inp { width: 100%; min-height: 44px; padding: .55rem .7rem; border-radius: 11px;
      border: 1px solid var(--line); background: var(--bg2); color: var(--text); font-size: 1rem; font-weight: 400; }
    textarea.inp { min-height: 70px; resize: vertical; line-height: 1.4; }
    .inp:focus { outline: 2px solid var(--gold); outline-offset: 0; border-color: transparent; }
    .seg { display: flex; flex-wrap: wrap; gap: .4rem; }
    .seg button { min-height: 40px; padding: .35rem .8rem; border-radius: 999px; border: 1px solid var(--line);
      background: var(--bg2); cursor: pointer; font-weight: 600; font-size: .9rem; }
    .seg button[aria-pressed="true"] { background: var(--gold); color: #1a1206; border-color: var(--gold); }
    input[type=range] { width: 100%; accent-color: var(--gold); min-height: 32px; }
    input[type=color] { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 2px; background: var(--bg2); }

    /* Progress + step nav */
    .progress { max-width: 1100px; margin: .5rem auto 0; display: flex; gap: 4px; }
    .progress span { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
    .progress span.done { background: var(--gold); }
    .progress span.cur { background: var(--maroon); }
    .stepnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; background: var(--panel);
      border-top: 1px solid var(--line); padding-bottom: var(--safe-b); }
    .stepnav a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      min-height: var(--nav-h); color: var(--muted); text-decoration: none; font-size: .68rem; font-weight: 600; position: relative; }
    .stepnav a svg { width: 22px; height: 22px; }
    .stepnav a.cur { color: var(--gold); }
    .stepnav a.cur::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; border-radius: 0 0 3px 3px; background: var(--gold); }
    .stepnav a .dot { position: absolute; top: 9px; right: calc(50% - 17px); width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
    @media (min-width: 820px) {
      .stepnav { position: static; max-width: 1100px; margin: .6rem auto 0; background: transparent; border: 0; padding: 0; gap: .35rem; }
      .stepnav a { flex-direction: row; gap: .4rem; min-height: 42px; font-size: .85rem; border-radius: 10px; background: var(--panel2); }
      .stepnav a.cur { background: var(--gold-soft); }
      .stepnav a.cur::before { display: none; }
      .stepnav a .dot { position: static; }
      .main { padding-bottom: calc(6rem + var(--safe-b)); }
    }
    .stepfoot { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + var(--safe-b)); z-index: 35; padding: .5rem .75rem;
      background: color-mix(in srgb, var(--bg) 92%, transparent); border-top: 1px solid var(--line); backdrop-filter: blur(10px); }
    .stepfoot .in { max-width: 1100px; margin: 0 auto; display: flex; gap: .5rem; align-items: center; }
    @media (min-width: 820px) { .stepfoot { bottom: 0; padding-bottom: calc(.5rem + var(--safe-b)); } }

    /* Home */
    .hero { text-align: center; padding: 1.6rem 1rem 1.2rem; border-radius: 20px; position: relative; overflow: hidden;
      background: radial-gradient(120% 90% at 50% 0%, rgba(212, 166, 74, .22), transparent 60%), linear-gradient(180deg, var(--panel2), var(--panel));
      border: 1px solid var(--line); }
    .hero h2 { font-family: var(--font-title); letter-spacing: .14em; text-transform: uppercase; font-size: 1.6rem; margin: .4rem 0; color: var(--gold); }
    .proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: .75rem; }
    .proj-card { display: flex; gap: .75rem; align-items: center; padding: .8rem; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; }
    .proj-card .thumb { width: 84px; height: 48px; border-radius: 8px; overflow: hidden; flex: none; background: #000; }
    .proj-card .thumb svg { width: 100%; height: 100%; display: block; }
    .proj-card h3 { margin: 0; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .empty > svg { margin: 0 auto; }
    .empty { text-align: center; padding: 2rem 1rem; border: 1px dashed var(--line); border-radius: 16px; }
    .tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: .75rem; }
    .tpl-card { border-radius: 14px; overflow: hidden; background: var(--panel); border: 1px solid var(--line); cursor: pointer; text-align: left; padding: 0; display: flex; flex-direction: column; }
    .tpl-card .cover { aspect-ratio: 16/9; background: #000; position: relative; }
    .tpl-card .cover svg { width: 100%; height: 100%; display: block; }
    .tpl-card .cover .ttl { position: absolute; inset: auto 0 0 0; padding: .6rem .7rem; background: linear-gradient(transparent, rgba(0,0,0,.8));
      color: #f6e7c4; font-family: var(--font-title); letter-spacing: .08em; text-transform: uppercase; font-size: .9rem; }
    .tpl-card .body { padding: .65rem .75rem .8rem; font-size: .85rem; }

    /* Characters */
    .char-card { display: grid; grid-template-columns: 96px 1fr; gap: .8rem; align-items: start; }
    .avatar-box { width: 96px; height: 116px; border-radius: 14px; background: var(--bg2); border: 1px solid var(--line); overflow: hidden; cursor: pointer; padding: 0; }
    .face-img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: 50% 30%; background: var(--bg2); }
    .opt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: .4rem; }
    .opt-grid button { border: 2px solid var(--line); background: var(--bg2); border-radius: 12px; padding: 4px; cursor: pointer; min-height: 44px; }
    .opt-grid button[aria-pressed="true"] { border-color: var(--gold); }
    .face-grid { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); }
    .face-grid button { padding: 0; overflow: hidden; aspect-ratio: 4 / 5; }
    .face-grid button .face-img { border-radius: 10px; }
    .swatches { display: flex; flex-wrap: wrap; gap: .45rem; }
    .swatches button { width: 40px; height: 40px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); }
    .swatches button[aria-pressed="true"] { border-color: var(--gold); }

    /* Script */
    .act { border-left: 3px solid var(--gold); padding-left: .75rem; }
    .act h3 { font-family: var(--font-title); letter-spacing: .08em; text-transform: uppercase; font-size: .95rem; margin: 0 0 .5rem; }
    .scene { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: .75rem; margin-bottom: .6rem; }
    .scene.flash, .line.flash { outline: 2px solid var(--danger); }
    .scene-h { display: flex; align-items: center; gap: .4rem; margin-bottom: .5rem; }
    .scene-h b { font-size: .9rem; }
    .line { display: grid; grid-template-columns: auto 120px 1fr auto; gap: .35rem; align-items: start; padding: .35rem 0; border-top: 1px dashed var(--line); }
    .line:first-child { border-top: 0; }
    .line select.inp { min-height: 40px; padding: .35rem .4rem; font-size: .88rem; }
    .line textarea.inp { min-height: 40px; padding: .4rem .55rem; font-size: .95rem; }
    @media (max-width: 560px) { .line { grid-template-columns: auto 1fr auto; } .line textarea { grid-column: 1 / -1; order: 5; } }
    .drag-handle { width: 32px; min-height: 40px; display: flex; align-items: center; justify-content: center; color: var(--muted); cursor: grab; touch-action: none; }
    .lines-actions { display: flex; flex-direction: column; gap: 2px; }
    .checker { position: sticky; top: 64px; }
    .issue { display: flex; gap: .5rem; align-items: flex-start; padding: .45rem .5rem; border-radius: 10px; cursor: pointer; font-size: .86rem; }
    .issue:hover { background: var(--panel2); }
    .issue .ic { flex: none; width: 18px; height: 18px; margin-top: 1px; }
    .dur-badge { font-variant-numeric: tabular-nums; font-weight: 700; padding: .3rem .6rem; border-radius: 10px; background: var(--gold-soft); color: var(--gold); font-size: .85rem; white-space: nowrap; }
    .dur-badge.over { background: rgba(179, 38, 30, .16); color: var(--danger); }

    /* Storyboard */
    .shot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: .7rem; }
    .shot-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; text-align: left; padding: 0; }
    .shot-card .frame { background: #000; }
    .shot-card .frame svg { display: block; width: 100%; height: auto; }
    .shot-card .meta { padding: .5rem .65rem .65rem; font-size: .8rem; }
    .shot-card .meta b { font-size: .88rem; }
    .frame-916 { max-width: 160px; margin: 0 auto; }

    /* Player */
    .stage-wrap { display: flex; justify-content: center; }
    .stage { position: relative; background: #000; border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); width: 100%; }
    .stage.r169 { aspect-ratio: 16 / 9; }
    .stage.r916 { aspect-ratio: 9 / 16; max-width: min(100%, 380px); }
    .stage canvas { width: 100%; height: 100%; display: block; }
    .stage .overlay-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #f6e7c4; background: rgba(0,0,0,.55); font-size: .95rem; }
    .stage.fs-css { position: fixed; inset: 0; z-index: 100; border-radius: 0; max-width: none; aspect-ratio: auto; display: flex; align-items: center; justify-content: center; }
    .stage.fs-css canvas { width: auto; height: auto; max-width: 100%; max-height: 100%; }
    .stage .fs-close { position: absolute; top: calc(.6rem + var(--safe-t)); right: .6rem; z-index: 2; }
    .controls { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin-top: .6rem; }
    .scrub { width: 100%; margin-top: .5rem; }
    .timecode { font-variant-numeric: tabular-nums; font-size: .85rem; color: var(--muted); }
    .tl { margin-top: .75rem; overflow-x: auto; overflow-y: hidden; padding: .4rem 0 .6rem; -webkit-overflow-scrolling: touch; }
    .tl-track { display: flex; gap: 3px; position: relative; min-height: 74px; align-items: stretch; }
    .tl-block { position: relative; flex: none; border-radius: 8px; overflow: hidden; background: var(--panel2); border: 1px solid var(--line);
      cursor: grab; touch-action: pan-x; user-select: none; -webkit-user-select: none; display: flex; flex-direction: column; justify-content: flex-end; }
    .tl-block.fixed { cursor: default; opacity: .75; }
    .tl-block.cur { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; }
    .tl-block.lifted { opacity: .4; }
    .tl-block .tl-bg { position: absolute; inset: 0; opacity: .55; pointer-events: none; }
    .tl-block .tl-bg svg { width: 100%; height: 100%; display: block; }
    .tl-block .tl-lbl { position: relative; padding: 2px 5px; font-size: .68rem; font-weight: 700; background: rgba(0,0,0,.55); color: #f6e7c4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tl-handle { position: absolute; top: 0; bottom: 0; right: 0; width: 16px; cursor: ew-resize; touch-action: none; display: flex; align-items: center; justify-content: center; }
    .tl-handle::after { content: ""; width: 4px; height: 26px; border-radius: 2px; background: var(--gold); }
    .tl-ghost { position: fixed; z-index: 200; pointer-events: none; opacity: .9; box-shadow: var(--shadow); }
    .tl-drop { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--gold); border-radius: 2px; pointer-events: none; }
    .tl-playhead { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--danger); pointer-events: none; z-index: 2; }
    .export-bar { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; }
    .export-bar > div { height: 100%; background: var(--gold); width: 0; transition: width .2s linear; }

    /* Banners, toasts, modal fallback */

  jalan: ['jalan', 'street', 'gang', 'road', 'trotoar'], kafe: ['kafe', 'cafe', 'kedai', 'warung', 'coffee', 'kopi', 'restoran'],
  sekolah: ['sekolah', 'school', 'kelas', 'class', 'kampus'], rumahsakit: ['rumah sakit', 'hospital', 'klinik', 'clinic'],
  hutan: ['hutan', 'forest', 'kebun'], stasiun: ['stasiun', 'station', 'kereta', 'train', 'terminal', 'peron'], loteng: ['loteng', 'attic', 'gudang'],
  masjid: ['masjid', 'mosque', 'mushola', 'surau'], taman: ['taman', 'park', 'halaman', 'garden'], studio: ['studio'],
  istana: ['istana', 'palace', 'singgasana', 'throne', 'kerajaan'], tamanistana: ['taman istana', 'palace garden', 'imperial garden', 'taman kerajaan'],

// Palace places are checked first so "taman istana" is not read as a plain park.
const LOC_MATCH_ORDER = ['tamanistana', 'kamaristana', 'istana'].concat(LOCS.filter((k) => !['tamanistana', 'kamaristana', 'istana'].includes(k)));
function locKey(loc) {
  if (!loc) return 'studio';
  if (LOCS.includes(loc)) return loc;
  const s = String(loc).toLowerCase();
  for (const k of LOC_MATCH_ORDER) if (LOC_WORDS[k].some((w) => s.includes(w))) return k;
  return 'studio';
}
function locLabel(loc) { return LOCS.includes(loc) ? lbl('loc', loc) : (loc || ''); }

function ageGroup(age) { age = +age || 0; return age < 13 ? 'anak' : age < 18 ? 'remaja' : age < 60 ? 'dewasa' : 'lansia'; }

   headscarf or costume of an older drawn avatar if it had one. Faces already used lose out. */
function pickPortrait(c, taken) {
  const g = (c.voice && c.voice.gender) || 'f'; const ag = AGE_GROUPS.indexOf(ageGroup(c.age));
  const old = c.avatar || {}; const want = [];
  if (old.hair === 'kerudung') want.push('kerudung');
  if (['seragam', 'batik', 'hanfu'].includes(old.outfit)) want.push(old.outfit);
  let best = null, bestScore = -Infinity;
  PORTRAITS.forEach((p) => {
    const d = Math.abs(AGE_GROUPS.indexOf(p.age) - ag);
    const s = (p.g === g ? 8 : 0) + (d === 0 ? 4 : d === 1 ? 1 : -2) + want.filter((w) => p.tags.includes(w)).length * 2 -
      (old.hair && old.hair !== 'kerudung' && p.tags.includes('kerudung') ? 2 : 0) - ((taken || []).includes(p.id) ? 6 : 0);
    if (s > bestScore) { best = p; bestScore = s; }

const byOrder = (a, b) => a.order - b.order;

/* ---------- shot planning ----------
   Every scene needs at least one shot. effectiveShots() never mutates: scenes
   without saved shots get an automatic layout, and lines not assigned to any
   shot fall into the scene's last shot. reconcileShots() saves that result. */
function autoShots(data, scene, lines, sceneIdx) {
  const L = lines.length;
  const count = 1 + Math.floor(L / 3);
  const per = Math.max(1, Math.ceil(L / count));
  const rnd = seeded(hashStr(scene.id));
  const speakersOf = (ls) => [...new Set(ls.map((d) => d.characterId).filter((id) => id && charById(data, id)))];
  let sceneSpeakers = speakersOf(lines);
  if (!sceneSpeakers.length) sceneSpeakers = data.characters.slice(0, 2).map((c) => c.id);
  const out = [];
  for (let i = 0; i < count; i++) {
    const chunk = lines.slice(i * per, (i + 1) * per);
    const type = i === 0 ? 'wide' : (i % 2 ? 'medium' : 'closeup');
    let chars = i === 0 ? sceneSpeakers.slice(0, 3) : speakersOf(chunk);
    if (!chars.length) chars = sceneSpeakers.slice(0, 2);
    if (type === 'closeup') chars = chars.slice(0, 1);
    if (type === 'medium') chars = chars.slice(0, 2);
    const pos = {};
    const slots = chars.length === 1 ? ['c'] : chars.length === 2 ? ['l', 'r'] : ['l', 'c', 'r'];
    chars.forEach((c, k) => { pos[c] = slots[k]; });
    out.push({
      id: uid('h'), sceneId: scene.id, order: i, type,
      camera: i === 0 ? 'zoomin' : pickR(['diam', 'geserkanan', 'zoomin', 'geserkiri', 'zoomout', 'diam'], rnd),
      transition: i === 0 ? (sceneIdx % 2 === 0 ? 'fade' : 'dissolve') : 'potong',
      characterIds: chars, positions: pos, dialogueIds: chunk.map((d) => d.id), durationOverrideMs: null,
    });
  }
  return out;
}
function effectiveShots(data) {
  const plan = [];
  scenesSorted(data).forEach((scene, si) => {
    const lines = linesOf(data, scene.id);
    let shots = shotsOf(data, scene.id);
    if (!shots.length) shots = autoShots(data, scene, lines, si);
    else shots = shots.map((s) => Object.assign({}, s, { dialogueIds: (s.dialogueIds || []).slice(), characterIds: (s.characterIds || []).filter((id) => charById(data, id)) }));
    const valid = new Map(lines.map((d) => [d.id, d]));
    const seen = new Set();
    shots.forEach((s) => { s.dialogueIds = s.dialogueIds.filter((id) => valid.has(id) && !seen.has(id) && seen.add(id)); });
    const missing = lines.filter((d) => !seen.has(d.id));
    if (missing.length) {
      // A new line goes to the shot holding the line just before it, else the last shot.
      missing.forEach((d) => {
        const prev = lines.slice(0, lines.indexOf(d)).reverse().find((p) => seen.has(p.id));
        const target = (prev && shots.find((s) => s.dialogueIds.includes(prev.id))) || shots[shots.length - 1];
        target.dialogueIds.push(d.id); seen.add(d.id);
      });
    }
    shots.forEach((s) => s.dialogueIds.sort((a, b) => valid.get(a).order - valid.get(b).order));
    shots.forEach((s, i) => plan.push({ shot: s, scene, sceneIdx: si, first: i === 0, lines: s.dialogueIds.map((id) => valid.get(id)) }));
  });
  return plan;
}
function reconcileShots(data) {
  const plan = effectiveShots(data);
  const ids = new Set(data.scenes.map((s) => s.id));
  data.shots = plan.map((p) => p.shot).filter((s) => ids.has(s.sceneId));
  return plan;
}

/* ---------- duration ---------- */
const WPS = 2.6;
const TITLE_MS = 4000, CREDITS_MS = 6000, TRANS_MS = 500, MIN_SHOT_MS = 2500;
function voiceOf(data, d) {
  if (d.characterId) { const c = charById(data, d.characterId); if (c) return c.voice; }
  return data.audio.narrator.voice;
}
function speakMs(data, d) {
  const words = String(d.text || '').trim().split(/\s+/).filter(Boolean).length;
  const rate = (voiceOf(data, d) || {}).rate || 1;
  return Math.max(1200, (words / (WPS * rate)) * 1000);
}
function lineMs(data, d) { return speakMs(data, d) + (d.pauseAfterMs != null ? d.pauseAfterMs : 500); }
function actionLine(scene) { return { id: 'act_' + scene.id, sceneId: scene.id, characterId: null, text: scene.action, pauseAfterMs: 400, isAction: true }; }
function shotLines(data, p) {
  const ls = p.lines.slice();
  if (p.first && data.audio.narrator.enabled && data.audio.narrator.readAction && String(p.scene.action || '').trim()) ls.unshift(actionLine(p.scene));
  return ls;
}
function shotSpeechMs(data, p) { return shotLines(data, p).reduce((a, d) => a + lineMs(data, d), 0); }
function shotBaseMs(data, p) {
  const speech = shotSpeechMs(data, p);
  const auto = Math.max(MIN_SHOT_MS, speech);
  return p.shot.durationOverrideMs ? Math.max(p.shot.durationOverrideMs, speech, 1000) : auto;
}
function buildTimeline(data, plan) {
  plan = plan || effectiveShots(data);
  const segs = [];
  let tm = 0;
  segs.push({ kind: 'title', start: 0, dur: TITLE_MS }); tm += TITLE_MS;
  plan.forEach((p, i) => {
    const transMs = p.shot.transition === 'potong' ? 0 : TRANS_MS;
    const base = shotBaseMs(data, p);
    const ls = shotLines(data, p);
    const speech = ls.reduce((a, d) => a + lineMs(data, d), 0);
    let cur = tm + transMs + Math.min(400, Math.max(0, (base - speech) / 2));
    const lines = ls.map((d) => { const dur = lineMs(data, d); const o = { d, start: cur, dur, speak: speakMs(data, d) }; cur += dur; return o; });
    segs.push({ kind: 'shot', idx: i, start: tm, dur: base + transMs, transMs, base, speech, p, lines });
    tm += base + transMs;
  });
  segs.push({ kind: 'credits', start: tm, dur: CREDITS_MS }); tm += CREDITS_MS;
  return { segs, total: tm, plan };
}
function estimateMs(data) { return buildTimeline(data).total; }

/* ---------- script checker ---------- */
function checkScript(data, totalMs) {
  const out = [];
  const used = new Set(data.dialogues.map((d) => d.characterId));
  data.characters.forEach((c) => { if (c.role !== 'narator' && !used.has(c.id)) out.push({ level: 'warn', code: 'noLine', targetId: c.id, kind: 'char', message: t('issNoLine', { n: c.name || '?' }) }); });
  scenesSorted(data).forEach((s, i) => {
    if (!String(s.location || '').trim()) out.push({ level: 'error', code: 'noLoc', targetId: s.id, kind: 'scene', message: t('issNoLoc', { i: i + 1 }) });
    linesOf(data, s.id).forEach((d) => {
      const len = String(d.text || '').trim().length;
      if (!len) out.push({ level: 'warn', code: 'empty', targetId: d.id, kind: 'line', message: t('issEmpty', { i: i + 1 }) });
      else if (len > MAX_LINE) out.push({ level: 'warn', code: 'long', targetId: d.id, kind: 'line', message: t('issLong', { i: i + 1, c: len }) });
      if (d.characterId && !charById(data, d.characterId)) out.push({ level: 'error', code: 'ghost', targetId: d.id, kind: 'line', message: t('issGhost', { i: i + 1 }) });
    });
  });
  const total = totalMs != null ? totalMs : estimateMs(data);
  if (total > data.project.targetMinutes * 60000) out.push({ level: 'warn', code: 'over', targetId: null, kind: 'dur', message: t('issOver') + ' (' + fmtTime(total) + ' / ' + fmtTime(data.project.targetMinutes * 60000) + ')' });
  return out;
}

/* ---------- storage (per Homeroom user, on this device) ---------- */
function tokenUserId() {
  try {
    const p = TOKEN.split('.')[1];
    if (!p) return null;
    const json = JSON.parse(decodeURIComponent(escape(atob(p.replace(/-/g, '+').replace(/_/g, '/')))));
    return json && json.id != null ? String(json.id) : null;
  } catch (_) { return null; }
}
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { if (e && (e.name === 'QuotaExceededError' || e.code === 22)) toast(t('storageFull')); return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (_) {} },
};
// An offline load carries no token, so reuse the last user seen rather than
// falling into an empty namespace.
const USER_ID = (() => { const id = tokenUserId(); if (id) { LS.set('dranus:lastUser', id); return id; } return LS.get('dranus:lastUser') || 'local'; })();
const KEY_INDEX = 'dranus:v1:' + USER_ID + ':index';
const keyProj = (id) => 'dranus:v1:' + USER_ID + ':p:' + id;
function loadIndex() { try { return JSON.parse(LS.get(KEY_INDEX) || '[]') || []; } catch (_) { return []; } }
function summaryOf(data) {
  return { id: data.project.id, title: data.project.title, genre: data.project.genre, targetMinutes: data.project.targetMinutes,
    estMs: estimateMs(data), updatedAt: data.project.updatedAt, chars: data.characters.length, scenes: data.scenes.length,
    cover: (scenesSorted(data)[0] || {}).location || 'studio', coverTime: (scenesSorted(data)[0] || {}).timeOfDay || 'malam' };
}
function writeProject(data) {
  data.project.updatedAt = Date.now();
  if (!LS.set(keyProj(data.project.id), JSON.stringify(data))) return false;
  const idx = loadIndex().filter((x) => x.id !== data.project.id);
  idx.unshift(summaryOf(data));
  return LS.set(KEY_INDEX, JSON.stringify(idx));
}
function readProject(id) { try { const raw = LS.get(keyProj(id)); return raw ? migrate(JSON.parse(raw)) : null; } catch (_) { return null; } }
function removeProject(id) { LS.del(keyProj(id)); LS.set(KEY_INDEX, JSON.stringify(loadIndex().filter((x) => x.id !== id))); }
function migrate(data) {
  if (!data || !data.project) return null;
  data.characters = data.characters || []; data.scenes = data.scenes || []; data.dialogues = data.dialogues || []; data.shots = data.shots || [];
  const a = defaultAudio();
  data.audio = Object.assign(a, data.audio || {});
  data.audio.narrator = Object.assign(defaultAudio().narrator, data.audio.narrator || {});
  data.audio.music = Object.assign(defaultAudio().music, data.audio.music || {});
  data.project.settings = Object.assign({ aspect: '16:9', defaultTransition: 'fade', playbackRate: 1 }, data.project.settings || {});
  data.project.visited = data.project.visited || {};
  // v1 characters were drawn avatars; give each one the closest portrait photo.
  data.characters.forEach((c) => {
    delete c.costumeColor;
    if (c.avatar && portraitById(c.avatar.photo)) return;
    c.avatar = { photo: pickPortrait(c, data.characters.map((x) => x !== c && x.avatar && x.avatar.photo).filter(Boolean)) };
  });

/* Give a project and every child new ids so copies and re-imports never collide. */
function remapIds(src) {
  const data = clone(src);
  const map = {};
  const re = (old, p) => { if (old == null) return old; if (!map[old]) map[old] = uid(p); return map[old]; };
  data.project.id = uid('p');
  data.characters.forEach((c) => { c.id = re(c.id, 'c'); });
  data.characters.forEach((c) => { c.relations = (c.relations || []).map((r) => ({ toCharacterId: map[r.toCharacterId] || null, label: r.label || '' })); });
  data.scenes.forEach((s) => { s.id = re(s.id, 's'); });
  data.dialogues.forEach((d) => { d.id = re(d.id, 'd'); d.sceneId = map[d.sceneId]; d.characterId = d.characterId ? (map[d.characterId] || null) : null; });
  data.dialogues = data.dialogues.filter((d) => d.sceneId);
  data.shots.forEach((s) => {
    s.id = re(s.id, 'h'); s.sceneId = map[s.sceneId];
    s.characterIds = (s.characterIds || []).map((id) => map[id]).filter(Boolean);
    const pos = {}; Object.keys(s.positions || {}).forEach((k) => { if (map[k]) pos[map[k]] = s.positions[k]; }); s.positions = pos;
    s.dialogueIds = (s.dialogueIds || []).map((id) => map[id]).filter(Boolean);
  });
  data.shots = data.shots.filter((s) => s.sceneId);
  const ps = {}; Object.keys(data.audio.music.perScene || {}).forEach((k) => { if (map[k]) ps[map[k]] = data.audio.music.perScene[k]; });
  data.audio.music.perScene = ps;
  data.audio.sfx = (data.audio.sfx || []).map((x) => Object.assign({}, x, { id: uid('f'), sceneId: map[x.sceneId] })).filter((x) => x.sceneId);

function validImport(obj) {
  const d = obj && obj.app === 'dranus' ? obj.data : obj;
  if (!d || typeof d !== 'object' || !d.project || typeof d.project !== 'object') return null;
  for (const k of ['characters', 'scenes', 'dialogues']) if (d[k] != null && !Array.isArray(d[k])) return null;
  if ((obj.schemaVersion || d.project.schemaVersion || 1) > SCHEMA_VERSION) return null;
  return migrate(clone(d));
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();

/* Builds a full draft { scenes, dialogues } from the project. Nothing is saved
   until the person taps Use Draft. */
function offlineScript(data) {
  const lang = data.project.dialogLang === 'en' ? 'en' : 'id';
  const B = SCRIPT_BANK[lang];
  const g = B.genre[data.project.genre] || B.genre.keluarga;
  const cast = data.characters.filter((c) => c.role !== 'narator');
  const people = cast.length ? cast : data.characters;
  const lead = people.find((c) => c.role === 'utama') || people[0];
  const others = people.filter((c) => c !== lead);
  const perAct = { 1: 1, 3: 2, 5: 3 }[data.project.targetMinutes] || 1;
  const nLines = { 1: 4, 3: 5, 5: 6 }[data.project.targetMinutes] || 4;
  const night = data.project.genre === 'horor' || data.project.genre === 'misteri';
  const pools = {};
  const draw = (k) => {
    const src = k === 'hook' || k === 'reveal' || k === 'resolve' ? g[k] : B[k];
    if (!pools[k] || !pools[k].length) pools[k] = shuffle(src);
    return pools[k].pop();
  };
  const scenes = [], dialogues = [];
  let otherIdx = 0;
  for (let act = 1; act <= 3; act++) {
    for (let k = 0; k < perAct; k++) {
      const locs = (GENRE_LOCS[data.project.genre] || GENRE_LOCS.keluarga)[act - 1];
      const loc = locs[k % locs.length];
      const other = others.length ? others[otherIdx++ % others.length] : lead;
      const fill = (s) => s.replace(/\{A\}/g, lead.name).replace(/\{B\}/g, other.name).replace(/\{place\}/g, lbl('loc', loc).toLowerCase());
      const sc = newScene(act, k);
      sc.location = loc;
      sc.timeOfDay = night ? (act === 1 && k === 0 ? 'siang' : 'malam') : TIMES[(act + k) % 3];
      sc.mood = pickR(B.moods[act - 1]);
      sc.action = fill(pickR(B.action[act - 1]));
      scenes.push(sc);
      const pat = ACT_PATTERN[act - 1].slice(0, nLines);
      pat.forEach((kind, i) => {
        // Lead and this scene's partner alternate; a third cast member joins once per scene.
        let speaker = i % 2 === 0 ? lead : other;
        if (others.length > 1 && i === pat.length - 1) speaker = others[(otherIdx + i) % others.length];
        // Lines only ever address the other person in the conversation.
        const to = speaker === lead ? other : lead;
        dialogues.push(newLine(sc.id, i, speaker.id, draw(kind).replace(/\{A\}|\{B\}/g, to.name).replace(/\{place\}/g, lbl('loc', loc).toLowerCase())));
      });
    }
  }
  // Make sure everyone speaks at least once.
  people.forEach((c) => {
    if (!dialogues.some((d) => d.characterId === c.id)) {
      const last = scenes[scenes.length - 1];
      dialogues.push(newLine(last.id, 99, c.id, (lang === 'en' ? 'I am glad to be part of this, ' : 'Aku senang bisa ada di sini, ') + lead.name + '.'));
    }
  });
  scenes.forEach((s) => renumber(dialogues.filter((d) => d.sceneId === s.id).sort(byOrder)));
  return { scenes, dialogues };
}

let AI_STATUS = null;
async function aiAvailable() {
  if (AI_STATUS !== null) return AI_STATUS;
  // Without a platform token the API would only answer 401.
  if (!TOKEN) return (AI_STATUS = false);
  try { const r = await fetch('/api/ai/status', { headers: authHeaders }); AI_STATUS = r.ok ? !!(await r.json()).llm : false; } catch (_) { AI_STATUS = false; }
  return AI_STATUS;
}
async function aiGenerate(kind, lang, input) {
  if (!navigator.onLine || !(await aiAvailable())) return null;
  const call = () => fetch('/api/ai/generate', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders), body: JSON.stringify({ kind, lang, input }) });
  try {
    let r = await call();
    if (r.status === 403) {
      const body = await r.json().catch(() => ({}));
      if (body.code !== 'grant_required' || !UN() || !UN().requestLlmAccess) return null;
      const g = await UN().requestLlmAccess().catch(() => ({ granted: false }));
      if (!g || !g.granted) { toast(t('aiGrantDeclined')); return null; }
      r = await call();
    }
    if (r.status === 429) { toast(t('aiCap')); return null; }
    if (!r.ok) return null;
    return (await r.json()).data || null;
  } catch (_) { return null; }
}

      if (load()) return res(TTS.voices);

      setTimeout(done, 1500);
    });

  },
  pick(lang, gender) {
    const pre = lang === 'en' ? 'en' : 'id';
    const inLang = TTS.voices.filter((v) => String(v.lang || '').toLowerCase().replace('_', '-').startsWith(pre));
    const F = /female|wanita|perempuan|damayanti|gadis|zira|samantha|victoria|karen|susan|serena|tessa|moira|fiona|ava|allison|sara|siti/i;
    const M = /\bmale|pria|laki|ardi|david|daniel|alex|fred|mark|george|james|tom|oliver|aaron|arthur/i;
    const want = gender === 'f' ? F : M;

  },
  speak(text, voice, lang, rateMul, onend) {
    if (!TTS.supported || !String(text || '').trim()) { if (onend) setTimeout(onend, 0); return null; }

function stepTokoh(body) {
  const d = App.data;
  const draw = () => {
    body.innerHTML = (TTS.supported ? '' : '<div class="banner">' + ICON.warn + '<span>' + esc(t('noTts')) + '</span></div>') +
      (d.characters.length < 2 ? '<div class="banner red">' + ICON.warn + '<span>' + esc(t('minChars')) + '</span></div>' : '') +
      d.characters.map((c) => charCard(c, d)).join('') +
      '<button class="btn primary big" data-act="add-char" data-testid="add-char"' + (d.characters.length >= 5 ? ' disabled' : '') + '>' + ICON.plus + esc(t('addChar')) + '</button>' +
      (d.characters.length >= 5 ? '<p class="small muted" style="margin:0">' + esc(t('maxChars')) + '</p>' : '');
  };
  draw();
  const cOf = (el) => charById(d, el.closest('[data-char]').dataset.char);
  on(body, '[data-act=add-char]', 'click', () => { if (d.characters.length >= 5) return; d.characters.push(newCharacter(d)); changed(); draw(); const last = $$('[data-char]', body).pop(); if (last) last.scrollIntoView({ behavior: 'smooth', block: 'center' }); });
  on(body, '[data-cf]', 'input', (e, el) => {
    const c = cOf(el); const f = el.dataset.cf;
    if (f === 'age') c.age = clamp(parseInt(el.value, 10) || 0, 0, 120);
    else if (f === 'rate') { c.voice.rate = parseFloat(el.value); $('[data-ref=rate]', el.closest('[data-char]')).textContent = fmtNum(c.voice.rate) + '×'; }
    else c[f] = el.value;
    changed();
  });
  on(body, '[data-cf=role]', 'change', (e, el) => { cOf(el).role = el.value; changed(); });
  on(body, '[data-cf=name]', 'change', () => draw());
  on(body, '[data-act=add-rel]', 'click', (e, b) => { const c = cOf(b); const o = d.characters.find((x) => x.id !== c.id); c.relations.push({ toCharacterId: o.id, label: '' }); changed(); draw(); });
  on(body, '[data-rel-label]', 'input', (e, el) => { cOf(el).relations[+el.dataset.relLabel].label = el.value; changed(); });
  on(body, '[data-rel-to]', 'change', (e, el) => { cOf(el).relations[+el.dataset.relTo].toCharacterId = el.value; changed(); });
  on(body, '[data-rel-del]', 'click', (e, b) => { cOf(b).relations.splice(+b.dataset.relDel, 1); changed(); draw(); });
  bindSegs(body, {
    vg: (v, id) => { charById(d, id).voice.gender = v; changed(); },
    vp: (v, id) => { charById(d, id).voice.pitch = v; changed(); },
  });
  on(body, '[data-act=listen]', 'click', async (e, b) => {
    const c = cOf(b);
    if (!TTS.supported) { toast(t('noTts')); return; }
    TTS.cancel(); await TTS.init();
    TTS.speak(d.project.dialogLang === 'en' ? STR.en.sampleLine.replace('{n}', c.name) : STR.id.sampleLine.replace('{n}', c.name), c.voice, d.project.dialogLang, 1);
  });
  on(body, '[data-act=del-char]', 'click', async (e, b) => {
    const c = cOf(b);
    if (!(await confirmDlg(t('delCharQ'), t('delCharMsg', { n: c.name }), t('del')))) return;
    d.characters = d.characters.filter((x) => x.id !== c.id);
    d.dialogues.forEach((x) => { if (x.characterId === c.id) x.characterId = null; });
    d.shots.forEach((s) => { s.characterIds = (s.characterIds || []).filter((id) => id !== c.id); if (s.positions) delete s.positions[c.id]; });
    d.characters.forEach((x) => { x.relations = (x.relations || []).filter((r) => r.toCharacterId !== c.id); });
    changed(); draw();
  });
  on(body, '[data-act=avatar]', 'click', (e, b) => openAvatar(cOf(b), () => { const card = $('[data-char="' + cOf(b).id + '"]', body); if (card) $('.avatar-box', card).innerHTML = avatarImg(cOf(b)); }));
}

  // Start on the character's own gender and age group; "Semua" widens either filter.

    const list = PORTRAITS.filter((p) => (fg === 'all' || p.g === fg) && (fa === 'all' || p.age === fa));
    box.innerHTML = '<h3>' + esc(t('faceOf', { n: c.name })) + '</h3><div style="width:140px;height:175px;margin:0 auto;border-radius:16px;overflow:hidden">' + avatarImg(c) + '</div>' +

  SND.unlock(); SND.setVolumes(d.audio.music.volume, d.audio.sfxVolume);
  SND.setMood(d.audio.music.perScene[sceneId] || d.audio.music.mood);
  d.audio.sfx.filter((f) => f.sceneId === sceneId).forEach((f) => SND.sfx(f.type, (f.offsetMs || 0) / 1000));
  const sc = d.scenes.find((s) => s.id === sceneId);
  const lines = linesOf(d, sceneId).slice();
  if (d.audio.narrator.enabled && d.audio.narrator.readAction && String(sc.action || '').trim()) lines.unshift(actionLine(sc));
  if (btn) btn.dataset.playing = '1';
  const done = () => { if (tok !== Preview.token) return; SND.stopMusic(); if (btn) { delete btn.dataset.playing; btn.innerHTML = ICON.play + esc(t('previewScene')); } };
  if (btn) btn.innerHTML = ICON.pause + esc(t('stop'));
  if (!TTS.supported) { setTimeout(done, 6000); return; }
  TTS.init().then(() => {
    let i = 0;
    const next = () => { if (tok !== Preview.token) return; if (i >= lines.length) return setTimeout(done, 800); const l = lines[i++]; TTS.speak(l.text, voiceOf(d, l), d.project.dialogLang, 1, () => setTimeout(next, l.pauseAfterMs != null ? l.pauseAfterMs : 400)); };
    next();
  });
}
function stepSuara(body, root) {
  const d = App.data, A = d.audio;
  App.cleanup.push(() => Preview.stop());
  const musicOpts = (cur, withFollow) => (withFollow ? '<option value=""' + (!cur ? ' selected' : '') + '>' + esc(t('followFilm')) + '</option>' : '') + MUSICS.map((m) => '<option value="' + m + '"' + (m === cur ? ' selected' : '') + '>' + esc(lbl('music', m)) + '</option>').join('');
  const draw = () => {
    const scenes = scenesSorted(d);
    const nv = A.narrator.voice;
    body.innerHTML = (TTS.supported ? '' : '<div class="banner">' + ICON.warn + '<span>' + esc(t('noTts')) + '</span></div>') +
      (SND.supported ? '' : '<div class="banner red">' + ICON.warn + '<span>' + esc(t('noAudio')) + '</span></div>') +
      '<div class="card stack"><h3 class="sec-title">' + esc(t('voice')) + '</h3>' + (d.characters.length ? d.characters.map((c) => '<div class="row" data-char="' + c.id + '"><span style="width:40px;height:48px;flex:none;border-radius:8px;overflow:hidden">' + avatarImg(c) + '</span><div class="grow"><b>' + esc(c.name) + '</b><div class="small muted">' + esc(voiceSummary(c.voice)) + '</div></div><button class="btn sm" data-listen="' + c.id + '">' + ICON.speaker + esc(t('listen')) + '</button></div>').join('') : '<p class="muted small">' + esc(t('needChars')) + '</p>') + '</div>' +
      '<div class="card stack"><h3 class="sec-title">' + esc(t('narrator')) + '</h3>' +
      '<label class="row" style="min-height:44px"><span class="grow"><b>' + esc(t('narratorOn')) + '</b><div class="small muted">' + esc(t('narratorHint')) + '</div></span><input type="checkbox" class="un-switch" data-nf="enabled"' + (A.narrator.enabled ? ' checked' : '') + '></label>' +
      '<label class="row" style="min-height:44px"><span class="grow">' + esc(t('readAction')) + '</span><input type="checkbox" class="un-switch" data-nf="readAction"' + (A.narrator.readAction ? ' checked' : '') + '></label>' +
      '<div class="fld"><span>' + esc(t('narratorVoice')) + '</span><div class="row wrap">' + segHtml('ng', ['m', 'f'], nv.gender, (x) => (x === 'f' ? t('female') : t('male'))) + segHtml('np', ['high', 'normal', 'low'], nv.pitch, (x) => t(x)) + '</div>' +
      '<div class="row"><span class="small muted">' + esc(t('rate')) + '</span><input type="range" min="0.7" max="1.4" step="0.05" value="' + nv.rate + '" data-nf="rate" class="grow"><button class="btn sm" data-act="listen-narr">' + ICON.speaker + esc(t('listen')) + '</button></div></div></div>' +
      '<div class="card stack"><h3 class="sec-title">' + esc(t('music')) + '</h3><div class="fld"><span>' + esc(t('musicAll')) + '</span>' + segHtml('mood', MUSICS, A.music.mood, (v) => lbl('music', v)) + '</div>' +
      '<div class="row"><span class="small muted">' + esc(t('volume')) + '</span><input type="range" min="0" max="1" step="0.05" value="' + A.music.volume + '" data-af="musicVol" class="grow"><button class="btn sm" data-act="music-preview">' + ICON.play + esc(t('preview')) + '</button></div>' +
      (scenes.length ? '<div class="fld"><span>' + esc(t('perScene')) + '</span>' + scenes.map((s, i) => '<div class="row" style="margin:.2rem 0"><span class="grow small">' + esc(t('scene')) + ' ' + (i + 1) + ': ' + esc(locLabel(s.location)) + '</span><select class="inp" style="width:auto" data-scene-music="' + s.id + '">' + musicOpts(A.music.perScene[s.id], true) + '</select></div>').join('') + '</div>' : '') + '</div>' +
      '<div class="card stack"><h3 class="sec-title">' + esc(t('sfx')) + '</h3><div class="row"><span class="small muted">' + esc(t('sfxVol')) + '</span><input type="range" min="0" max="1" step="0.05" value="' + A.sfxVolume + '" data-af="sfxVol" class="grow"></div>' +
      '<div class="row wrap">' + SFXS.map((x) => '<button class="btn sm" data-sfx-try="' + x + '">' + ICON.speaker + esc(lbl('sfx', x)) + '</button>').join('') + '</div>' +
      scenes.map((s, i) => '<div style="border-top:1px dashed var(--line);padding-top:.5rem"><div class="row"><b class="grow small">' + esc(t('scene')) + ' ' + (i + 1) + ': ' + esc(locLabel(s.location)) + '</b><button class="btn sm ghost" data-add-sfx="' + s.id + '">' + ICON.plus + esc(t('addSfx')) + '</button></div>' +
        A.sfx.filter((f) => f.sceneId === s.id).map((f) => '<div class="row" style="margin-top:.3rem" data-sfx="' + f.id + '"><select class="inp" style="width:auto" data-sfx-f="type">' + SFXS.map((x) => '<option value="' + x + '"' + (x === f.type ? ' selected' : '') + '>' + esc(lbl('sfx', x)) + '</option>').join('') + '</select><span class="small muted">' + esc(t('at')) + '</span><input class="inp" style="width:80px" type="number" min="0" max="60" step="0.5" data-sfx-f="offset" value="' + (f.offsetMs || 0) / 1000 + '"><span class="grow"></span><button class="icon-btn sm" data-sfx-play aria-label="' + esc(t('preview')) + '">' + ICON.play + '</button><button class="icon-btn sm" data-sfx-del aria-label="' + esc(t('del')) + '">' + ICON.trash + '</button></div>').join('') + '</div>').join('') + '</div>' +
      (scenes.length ? '<div class="card stack"><h3 class="sec-title">' + esc(t('previewScene')) + '</h3><div class="row"><select class="inp grow" data-ref="pscene">' + scenes.map((s, i) => '<option value="' + s.id + '">' + esc(t('scene')) + ' ' + (i + 1) + ': ' + esc(locLabel(s.location)) + '</option>').join('') + '</select><button class="btn primary" data-act="pscene">' + ICON.play + esc(t('previewScene')) + '</button></div></div>' : '');
  };
  draw();
  bindSegs(body, {
    ng: (v) => { A.narrator.voice.gender = v; changed(); }, np: (v) => { A.narrator.voice.pitch = v; changed(); },
    mood: (v) => { A.music.mood = v; changed(); if (SND.mood !== 'none') SND.setMood(v); },
  });
  on(body, '[data-nf]', 'change', (e, el) => { const f = el.dataset.nf; if (f === 'rate') A.narrator.voice.rate = parseFloat(el.value); else A.narrator[f] = el.checked; changed(); refreshDur(root); });
  on(body, '[data-af]', 'input', (e, el) => { if (el.dataset.af === 'musicVol') A.music.volume = parseFloat(el.value); else A.sfxVolume = parseFloat(el.value); SND.setVolumes(A.music.volume, A.sfxVolume); changed(); });
  on(body, '[data-scene-music]', 'change', (e, el) => { if (el.value) A.music.perScene[el.dataset.sceneMusic] = el.value; else delete A.music.perScene[el.dataset.sceneMusic]; changed(); });
  on(body, '[data-listen]', 'click', async (e, b) => { const c = charById(d, b.dataset.listen); if (!TTS.supported) return toast(t('noTts')); TTS.cancel(); await TTS.init(); TTS.speak((d.project.dialogLang === 'en' ? STR.en : STR.id).sampleLine.replace('{n}', c.name), c.voice, d.project.dialogLang, 1); });
  on(body, '[data-act=listen-narr]', 'click', async () => { if (!TTS.supported) return toast(t('noTts')); TTS.cancel(); await TTS.init(); const sc = scenesSorted(d)[0]; TTS.speak((sc && sc.action) || d.project.premise || t('tagline'), A.narrator.voice, d.project.dialogLang, 1); });
  on(body, '[data-act=music-preview]', 'click', (e, b) => {
    if (!SND.unlock()) return toast(t('noAudio'));
    SND.setVolumes(A.music.volume, A.sfxVolume);
    if (SND.mood !== 'none') { SND.stopMusic(); b.innerHTML = ICON.play + esc(t('preview')); }
    else { SND.setMood(A.music.mood); b.innerHTML = ICON.pause + esc(t('stop')); }
  });
  on(body, '[data-sfx-try]', 'click', (e, b) => { if (!SND.unlock()) return toast(t('noAudio')); SND.setVolumes(A.music.volume, A.sfxVolume); SND.sfx(b.dataset.sfxTry); });
  on(body, '[data-add-sfx]', 'click', (e, b) => { A.sfx.push({ id: uid('f'), sceneId: b.dataset.addSfx, type: 'pintu', offsetMs: 0 }); changed(); draw(); });
  const fOf = (el) => A.sfx.find((f) => f.id === el.closest('[data-sfx]').dataset.sfx);
  on(body, '[data-sfx-f]', 'change', (e, el) => { const f = fOf(el); if (el.dataset.sfxF === 'type') f.type = el.value; else f.offsetMs = clamp(Math.round((parseFloat(el.value) || 0) * 1000), 0, 60000); changed(); });
  on(body, '[data-sfx-play]', 'click', (e, b) => { if (!SND.unlock()) return toast(t('noAudio')); SND.setVolumes(A.music.volume, A.sfxVolume); SND.sfx(fOf(b).type); });
  on(body, '[data-sfx-del]', 'click', (e, b) => { const f = fOf(b); A.sfx = A.sfx.filter((x) => x !== f); changed(); draw(); });
  on(body, '[data-act=pscene]', 'click', (e, b) => { if (b.dataset.playing) { Preview.stop(); delete b.dataset.playing; b.innerHTML = ICON.play + esc(t('previewScene')); return; } previewScene($('[data-ref=pscene]', body).value, b); });
}

/* ---------- step 6: Putar & Ekspor ---------- */
function stepPutar(body, root) {
  const d = App.data;
  const mime = Player.exportSupport();
  body.innerHTML = (TTS.supported ? '' : '<div class="banner">' + ICON.warn + '<span>' + esc(t('noTts')) + '</span></div>') +
    '<div class="card" data-ref="player"></div>' +
    '<div class="card stack" data-testid="export"><h3 class="sec-title">' + esc(t('exportVideo')) + '</h3><p class="small muted" style="margin:0">' + esc(t('exportNote')) + '</p>' +
    (mime ? '<p class="small muted" style="margin:0">' + esc(t('exportRealtime')) + '</p>' : '<div class="banner red">' + ICON.warn + '<span>' + esc(t('noRecorder')) + '</span></div>') +
    '<div class="row wrap" data-ref="exbtns"><button class="btn primary big" data-act="export" data-testid="export-btn"' + (mime ? '' : ' disabled') + '>' + ICON.film2 + esc(t('exportVideo')) + '</button></div>' +
    '<div class="stack hidden" data-ref="exprog"><div class="row"><span class="spinner"></span><span class="grow small" data-ref="exlabel"></span><button class="btn sm" data-act="excancel">' + esc(t('cancel')) + '</button></div><div class="export-bar"><div data-ref="exbar"></div></div></div>' +
    '<div class="stack hidden" data-ref="exresult"></div></div>';
  const player = new Player($('[data-ref=player]', body), () => App.data, {
    editable: true,
    onAspect: (a) => { d.project.settings.aspect = a; changed(); },
    onResize: (shotId, ms) => { const s = d.shots.find((x) => x.id === shotId); if (s) { s.durationOverrideMs = ms; changed(); player.refresh(); refreshDur(root); } },
    onMove: (from, to) => {
      const list = reconcileShots(d).map((p) => p.shot);
      const [m] = list.splice(from, 1); list.splice(to, 0, m);
      const prev = list[to - 1], next = list[to + 1];
      let sc = m.sceneId;
      if (prev && next && prev.sceneId === next.sceneId) sc = prev.sceneId;
      else if (!((prev && prev.sceneId === m.sceneId) || (next && next.sceneId === m.sceneId))) sc = prev ? prev.sceneId : next.sceneId;
      if (sc !== m.sceneId) { m.sceneId = sc; m.dialogueIds = []; }
      const counts = {}; list.forEach((s) => { counts[s.sceneId] = counts[s.sceneId] || 0; s.order = counts[s.sceneId]++; });
      d.shots = list; reconcileShots(d); changed(); player.refresh(); refreshDur(root);
    },
  });
  App.player = player;
  let blobUrl = null;
  App.cleanup.push(() => { if (blobUrl) URL.revokeObjectURL(blobUrl); });
  const prog = $('[data-ref=exprog]', body), btns = $('[data-ref=exbtns]', body), res = $('[data-ref=exresult]', body);
  on(body, '[data-act=export]', 'click', async () => {
    btns.classList.add('hidden'); prog.classList.remove('hidden'); res.classList.add('hidden');
    const upd = (f) => { $('[data-ref=exbar]', body).style.width = Math.round(f * 100) + '%'; $('[data-ref=exlabel]', body).textContent = t('exporting', { p: Math.round(f * 100) + '%' }); };
    upd(0);
    try {
      const blob = await player.exportVideo(upd);
      if (blobUrl) URL.revokeObjectURL(blobUrl);
      blobUrl = URL.createObjectURL(blob);
      const fname = fileSafe(d.project.title) + '.webm';
      res.innerHTML = '<div class="row" style="color:var(--ok);font-weight:700">' + ICON.check + esc(t('videoReady')) + '</div><video controls playsinline src="' + blobUrl + '" style="width:100%;max-height:60vh;border-radius:12px;background:#000"></video>' +
        '<div class="row wrap"><a class="btn gold big" href="' + blobUrl + '" download="' + esc(fname) + '" data-testid="download-webm">' + ICON.download + esc(t('download')) + '</a>' +
        (navigator.canShare && navigator.canShare({ files: [new File([blob], fname, { type: 'video/webm' })] }) ? '<button class="btn" data-act="share">' + esc(t('share')) + '</button>' : '') + '</div><p class="tiny muted" style="margin:0">' + esc(t('longPress')) + '</p>';
      const sb = $('[data-act=share]', res); if (sb) sb.onclick = () => navigator.share({ files: [new File([blob], fname, { type: 'video/webm' })], title: d.project.title }).catch(() => {});
      res.classList.remove('hidden');
      toast(t('videoReady'));
    } catch (e) {
      if (!e || e.message !== 'cancelled') { console.warn('export failed', e); toast(t('exportFail')); }
    }
    prog.classList.add('hidden'); btns.classList.remove('hidden');
  });
  on(body, '[data-act=excancel]', 'click', () => { if (player.exportCancel) player.exportCancel(); });
}

/* ---------- boot ---------- */
(async function boot() {
  const own = LS.get('dranus:lang');
  if (own) LANG = own === 'en' ? 'en' : 'id';
  else {
    try {
      const un = UN();
      if (un && un.getUserLocale) {
        const r = await Promise.race([un.getUserLocale(), new Promise((res) => setTimeout(() => res(null), 600))]);
        if (r && r.locale && /^en/i.test(r.locale)) LANG = 'en';
      }
    } catch (_) {}
  }
  document.documentElement.lang = LANG;
  window.addEventListener('usernode:locale-changed', (e) => { if (LS.get('dranus:lang')) return; const l = e.detail && e.detail.locale; LANG = l && /^en/i.test(l) ? 'en' : 'id'; render(); });
  window.addEventListener('usernode:theme-changed', () => { if (!LS.get('dranus:theme')) render(); });
  window.addEventListener('hashchange', render);
  window.addEventListener('pagehide', () => saveNow(false));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(false); });
  if (TTS.supported) TTS.init();
  render();
})();
  </script>
